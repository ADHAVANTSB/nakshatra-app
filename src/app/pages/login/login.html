<main class="auth-page"><section class="auth-card"><span class="eyebrow">NAKSHATRA</span><h1>Sign in</h1><p>Use approved frontend-demo access to preview the application.</p><div class="demo-note">This is a frontend-only adapter. Passwords are never stored or verified here.</div>@if (errors().length) { <div class="alert error"><ul>@for (error of errors(); track error) { <li>{{ error }}</li> }</ul></div> }<form (ngSubmit)="login()"><label for="login-email">Email</label><input id="login-email" type="email" [ngModel]="email()" (ngModelChange)="email.set($event)" name="email" autocomplete="email" /><label for="login-password">Password</label><input id="login-password" type="password" [ngModel]="password()" (ngModelChange)="password.set($event)" name="password" autocomplete="current-password" /><button type="submit" [disabled]="loading()">{{ loading() ? 'Signing in…' : 'Sign in' }}</button></form><p class="auth-link">Need access? <a routerLink="/register">Submit a registration request</a></p></section></main>
