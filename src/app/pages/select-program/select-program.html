<section class="nk-scope-page" aria-labelledby="select-program-title">
  <header class="nk-scope-head">
    <p class="nk-scope-kicker">Nakshatra 2026</p>
    <h1 id="select-program-title">Choose your programme</h1>
    <p class="nk-scope-lede">
      Pick the programme you are working in. You will choose a zone on the next
      step, and can switch either at any time.
    </p>
  </header>

  <div class="nk-program-grid" role="group" aria-label="Programme choices">
    @for (program of programs; track program.id) {
      <button
        type="button"
        class="nk-program-card"
        [class.nk-program-card-arts]="program.id === 'ARTS'"
        [class.nk-program-card-sports]="program.id === 'SPORTS'"
        (click)="select(program.id)"
      >
        <span class="nk-program-icon" aria-hidden="true">
          @switch (program.icon) {
            @case ('arts') {
              <svg viewBox="0 0 24 24" width="28" height="28" fill="none"
                stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 3v2.5" />
                <path d="M12 5.5c-4.4 0-7.5 3-7.5 6.6 0 3.7 3.1 6.6 7.5 6.6h.6c1 0 1.7.8 1.7 1.7 0 .6-.3 1.1-.7 1.4.9.2 1.9.2 2.9 0 3-1 4.5-3.9 4.5-7.2 0-5-4-9.1-9-9.1Z" />
                <circle cx="8.4" cy="11.4" r="1.15" fill="currentColor" stroke="none" />
                <circle cx="12" cy="9.2" r="1.15" fill="currentColor" stroke="none" />
                <circle cx="15.7" cy="11.4" r="1.15" fill="currentColor" stroke="none" />
              </svg>
            }
            @case ('sports') {
              <svg viewBox="0 0 24 24" width="28" height="28" fill="none"
                stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="8.5" />
                <path d="M12 3.5c2.6 2.3 4 5.2 4 8.5s-1.4 6.2-4 8.5c-2.6-2.3-4-5.2-4-8.5s1.4-6.2 4-8.5Z" />
                <path d="M3.6 10.2c2.6.9 5.5.9 8.4.9s5.8 0 8.4-.9" />
              </svg>
            }
          }
        </span>
        <span class="nk-program-name">{{ program.label }}</span>
        <span class="nk-program-tagline">{{ program.tagline }}</span>
        <span class="nk-program-cta" aria-hidden="true">Continue →</span>
      </button>
    }
  </div>

  <p class="nk-scope-note">{{ scopeNote }}</p>
</section>
