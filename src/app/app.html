<div class="app-shell">

  <!-- Mobile Overlay -->
  @if (isMobileMenuOpen) {
    <button
      class="mobile-overlay"
      aria-label="Close navigation"
      (click)="closeMobileMenu()">
    </button>
  }

  <!-- Sidebar -->
  <aside
    class="sidebar"
    [class.sidebar--open]="isMobileMenuOpen">

    <!-- Brand -->
    <div class="brand">

      <div class="brand-mark">
        N
      </div>

      <div class="brand-copy">
        <span class="brand-name">NAKSHATRA</span>
        <span class="brand-subtitle">Event Management</span>
      </div>

      <button
        class="mobile-close"
        aria-label="Close menu"
        (click)="closeMobileMenu()">
        ×
      </button>

    </div>

    <!-- Navigation -->
    <nav class="navigation">

      <div class="navigation-section">
        <span class="navigation-title">MAIN MENU</span>

        @for (item of navigationItems; track item.route) {

          <a
            class="navigation-item"
            [routerLink]="item.route"
            routerLinkActive="navigation-item--active"
            [routerLinkActiveOptions]="{ exact: true }"
            (click)="closeMobileMenu()">

            <span class="navigation-icon">
              {{ item.icon }}
            </span>

            <span>{{ item.label }}</span>

          </a>

        }
      </div>

      <div class="navigation-bottom">

        <a
          class="navigation-item"
          [routerLink]="settingsItem.route"
          routerLinkActive="navigation-item--active"
          (click)="closeMobileMenu()">

          <span class="navigation-icon">
            {{ settingsItem.icon }}
          </span>

          <span>{{ settingsItem.label }}</span>

        </a>

      </div>

    </nav>

    <!-- Event Status -->
    <div class="event-card">

      <div class="event-card-icon">
        ✦
      </div>

      <div>
        <strong>Nakshatra 2026</strong>
        <span>Event Management</span>
      </div>

    </div>

  </aside>


  <!-- Main Application -->
  <main class="main-area">

    <!-- Desktop / Mobile Header -->
    <header class="topbar">

      <div class="topbar-left">

        <button
          class="menu-button"
          aria-label="Open navigation"
          (click)="toggleMobileMenu()">

          <span></span>
          <span></span>
          <span></span>

        </button>

        <div class="page-brand">
          <span class="page-brand-name">NAKSHATRA</span>
          <span class="page-brand-divider"></span>
          <span class="page-brand-context">
            Event Management
          </span>
        </div>

      </div>

      <div class="topbar-actions">

        <button
          class="icon-button"
          aria-label="Notifications">
          ♧
          <span class="notification-dot"></span>
        </button>

        <div class="user-profile">

          <div class="user-avatar">
            A
          </div>

          <div class="user-details">
            <strong>Admin</strong>
            <span>Administrator</span>
          </div>

        </div>

      </div>

    </header>


    <!-- Page -->
    <section class="page-container">

      <router-outlet />

    </section>

  </main>

</div>
