# QA gates for nakshatra-app: unit tests, type-check, production build, E2E.
# Separate from any deployment workflow — this only verifies, never deploys.
name: QA

on:
  pull_request:
  push:
    branches: [main]

jobs:
  qa:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nakshatra-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nakshatra-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Unit tests (vitest)
        run: npm test

      - name: Type-check
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Production build
        run: npm run build

      - name: E2E (desktop/tablet/mobile emulation, stubbed backend)
        run: npx playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: nakshatra-app/playwright-report
          retention-days: 14
